[package]
name = "metarm"
version = "0.1.0"
edition = "2021"
authors = ["Kris Huber <kris@krishuber.xyz>"]
description = "Strip metadata (EXIF, GPS, XMP, comments) from JPEG, PNG and WebP images, invoked like rm"
license = "MIT"
repository = "https://github.com/krissemicolon/metarm"
readme = "README.md"
keywords = ["metadata", "exif", "privacy", "strip", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["src/**/*", "tests/**/*", "metarm.1", "README.md", "LICENSE"]

[dependencies]
clap = "2.33.3"
